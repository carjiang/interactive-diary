services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: interactive-diary-app
    container_name: interactive-diary

    # DEV MODE: keep container alive
    command: ["tail", "-f", "/dev/null"]

    working_dir: /app

    volumes:
      - .:/app

    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"

    env_file:
      - .env

    restart: unless-stopped

    stdin_open: true
    tty: true